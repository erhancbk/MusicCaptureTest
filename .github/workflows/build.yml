name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK signing and package
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          echo "APK size:"; ls -lh "$APK"
          echo "APK signature verification:"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo "Package metadata:"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | head -n 12
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SesTest-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SesTest-debug-apk
          path: SesTest-debug.apk
          if-no-files-found: error